<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Portal - Search Doctor</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0fdf4; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #15803d; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { background-color: #15803d; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #15803d; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Smart Clinic - Patient Portal</h2>
        <h3>Search Doctor by Name</h3>
        <div class="search-box">
            <input type="text" value="Gregory House" placeholder="Enter doctor's name...">
            <button class="btn">Search</button>
        </div>
        
        <h3>Search Results</h3>
        <table>
            <thead>
                <tr>
                    <th>Doctor Name</th>
                    <th>Speciality</th>
                    <th>Available Times</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Dr. Gregory House</td>
                    <td>Cardiology</td>
                    <td>08:00, 09:00, 10:00, 14:00</td>
                    <td><button class="btn" style="padding: 5px 10px;">Book</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
